<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta http-equiv=""X-UA-Compatible" content="IE=edge">
        <title>PPSC Cyber Club</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap" rel="stylesheet">   
        <link href="/assets/css/login.css" rel="stylesheet">
        <script src="https://kit.fontawesome.com/7ee24494c8.js" crossorigin="anonymous"></script>
    </head>
    <body>
    <section class="cyber-logo">
  <img src="/assets/images/cyberlogo2.png" alt="Pikes Peak State College Cyber Club">
</section>
<section class="the-form">
<section class="fake-form" aria-hidden="true">
<form class="login">
<label for="user" class="user">Username:</label><br>
<input type="text" aria-label="username" name="username" value="Guest" disabled><br>
<label for="pass" class="pass">Password:</label><br>
<input type="text" aria-label="password" name="password" value="*****************" disabled><br>
</form>
</section>
<section class="enter-site">
<div aria-label="Enter the Site" id="enterBtn" class="enter" role="button" tabindex="0"><i class="fa-solid fa-arrow-right"></i></div>
<script>
const btn = document.getElementById('enterBtn');
const clickSfx = new Audio('/assets/sounds/mouseclick.mp3');
clickSfx.preload = 'auto';

let isNavigating = false;

function triggerEnter() {
  if (isNavigating) return;
  isNavigating = true;

  const destination = '/main.html';

  clickSfx.currentTime = 0;

  // Navigate when the sound finishes
  clickSfx.onended = () => {
    window.location.assign(destination);
  };

  // Play audio
  clickSfx.play().catch(() => {
    // If audio fails or is blocked, navigate anyway
    window.location.assign(destination);
  });

  // Safety net in case onended doesn't fire
  setTimeout(() => {
    window.location.assign(destination);
  }, 350);
}

// Mouse click
btn.addEventListener('click', triggerEnter);

// Keyboard support (Enter and Space)
btn.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' || e.key === ' ') {
    e.preventDefault(); // Stop spacebar from scrolling the page
    triggerEnter();
  }
});
  </script>
  </section>
</section>
    </body>
    </html>
